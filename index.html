<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶</title>
    <style>
        @font-face {
            font-family: 'MojFont';
            src: url('MatrixType-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'MojFont', monospace, sans-serif;
        }

        #bg-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .marquee-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            overflow: hidden;
            white-space: nowrap;
            pointer-events: none;
            padding: 12px 0;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            font-size: 12px;
            color: #e0e0e0;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 3px rgba(255, 255, 255, 0.4);
            animation: marquee 30s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <span class="marquee-text" id="marquee-text-content">loading...</span>
    </div>

    <video id="bg-video" autoplay loop muted playsinline>
        <source src="loop.mp4" type="video/mp4">
    </video>

    <audio id="bg-audio" preload="auto"></audio>

    <script>
        const BIN_ID = '6ab91271ffd5d1605334648f';
        const marqueeElement = document.getElementById('marquee-text-content');

        function loadMarqueeText() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`)
                .then(res => {
                    if (!res.ok) throw new Error("error: brak sieci lub brak dostepu do chmury");
                    return res.json();
                })
                .then(data => {
                    let extractedText = "";

                    if (data.record && typeof data.record === 'object') {
                        if (data.record.text) {
                            extractedText = data.record.text;
                        } else if (data.record.record && data.record.record.text) {
                            extractedText = data.record.record.text;
                        }
                    } else if (typeof data.record === 'string') {
                        extractedText = data.record;
                    }

                    if (extractedText) {
                        marqueeElement.textContent = extractedText;
                    } else {
                        marqueeElement.textContent = "error: brak danych";
                    }
                })
                .catch(err => {
                    console.error("error:", err);
                    marqueeElement.textContent = "error";
                });
        }

        loadMarqueeText();

        const playlist = [
            '1.mp3', '2.mp3', '3.mp3', '4.mp3', '5.mp3',
            '6.m4a', '7.m4a', '8.m4a', '9.m4a', '10.m4a',
            '11.m4a', '12.m4a', '13.m4a', '14.m4a', '15.m4a',
            '16.m4a', '17.m4a', '18.m4a', '19.m4a', '20.m4a',
            '21.mp3', '22.mp3', '23.mp3', '24.mp3', '25.mp3',
            '26.mp3', '27.mp3'
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffle(playlist);

        let currentIndex = 0;
        const audio = document.getElementById('bg-audio');

        function playTrack(index) {
            audio.src = playlist[index];
            audio.load();
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.log("autoplay zablokowany przez przegladarke. kliknij gdziekolwiek na stronie, aby odtworzyc.", err);
                });
            }
        }

        audio.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            if (currentIndex === 0) shuffle(playlist);
            playTrack(currentIndex);
        });

        function startAudio() {
            playTrack(currentIndex);
            
            window.removeEventListener('click', startAudio);
            window.removeEventListener('touchstart', startAudio);
            window.removeEventListener('keydown', startAudio);
        }

        window.addEventListener('click', startAudio);
        window.addEventListener('touchstart', startAudio);
        window.addEventListener('keydown', startAudio);
    </script>

</body>
</html>
