<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶⓶</title>

    <!-- Skrypty CDN dla Butterchurn i zestawu presetów Milkdrop -->
    <script src="https://unpkg.com/butterchurn"></script>
    <script src="https://unpkg.com/butterchurn-presets"></script>

    <style>
        @font-face {
            font-family: 'MojFont';
            src: url('MatrixType-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'MojFont', monospace, sans-serif;
        }

        #bg-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Pełnoekranowy Canvas dla Butterchurna z nałożeniem na wideo */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            opacity: 0.5;
            mix-blend-mode: screen;
            filter: grayscale(100%);
        }

        .marquee-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            overflow: hidden;
            white-space: nowrap;
            pointer-events: none;
            padding: 12px 0;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            font-size: 12px;
            color: #e0e0e0;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 3px rgba(255, 255, 255, 0.4);
            animation: marquee 30s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <span class="marquee-text" id="marquee-text-content">loading...</span>
    </div>

    <video id="bg-video" autoplay loop muted playsinline>
        <source src="loop.mp4" type="video/mp4">
    </video>

    <!-- Canvas do renderowania wizualizacji Milkdrop -->
    <canvas id="canvas"></canvas>

    <audio id="bg-audio" preload="auto" crossorigin="anonymous"></audio>

    <script>
        const BIN_ID = '6ab91271ffd5d1605334648f';
        const marqueeElement = document.getElementById('marquee-text-content');

        function loadMarqueeText() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`)
                .then(res => {
                    if (!res.ok) throw new Error("error: brak sieci lub brak dostepu do chmury");
                    return res.json();
                })
                .then(data => {
                    let extractedText = "";

                    if (data.record && typeof data.record === 'object') {
                        if (data.record.text) {
                            extractedText = data.record.text;
                        } else if (data.record.record && data.record.record.text) {
                            extractedText = data.record.record.text;
                        }
                    } else if (typeof data.record === 'string') {
                        extractedText = data.record;
                    }

                    if (extractedText) {
                        marqueeElement.textContent = extractedText;
                    } else {
                        marqueeElement.textContent = "error: brak danych";
                    }
                })
                .catch(err => {
                    console.error("error:", err);
                    marqueeElement.textContent = "error";
                });
        }

        loadMarqueeText();

        const playlist = [
            '1.mp3', '2.mp3', '3.mp3', '4.mp3', '5.mp3',
            '6.m4a', '7.m4a', '8.m4a', '9.m4a', '10.m4a',
            '11.m4a', '12.m4a', '13.m4a', '14.m4a', '15.m4a',
            '16.m4a', '17.m4a', '18.m4a', '19.m4a', '20.m4a',
            '21.mp3', '22.mp3', '23.mp3', '24.mp3', '25.mp3',
            '26.mp3', '27.mp3'
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffle(playlist);

        let currentIndex = 0;
        const audio = document.getElementById('bg-audio');
        const canvas = document.getElementById('canvas');

        // --- KONFIGURACJA BUTTERCHURN ---
        let audioContext = null;
        let visualizer = null;
        let isButterchurnInit = false;

        function initButterchurn() {
            if (isButterchurnInit) return;

            // Ustawienie wymiarów płótna
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaElementSource(audio);

            visualizer = butterchurn.default.createVisualizer(audioContext, canvas, {
                width: window.innerWidth,
                height: window.innerHeight,
                pixelRatio: window.devicePixelRatio || 1
            });

            visualizer.connectAudio(source);
            source.connect(audioContext.destination);

            // Pobranie i załadowanie losowego presetu Milkdrop
            const presets = butterchurnPresets.getPresets();
            const presetKeys = Object.keys(presets);
            const randomPreset = presets[presetKeys[Math.floor(Math.random() * presetKeys.length)]];
            
            visualizer.loadPreset(randomPreset, 0.0);

            // Zmiana presetu co 30 sekund
            setInterval(() => {
                const nextPreset = presets[presetKeys[Math.floor(Math.random() * presetKeys.length)]];
                visualizer.loadPreset(nextPreset, 2.7);
            }, 30000);

            // Pętla renderująca
            function renderLoop() {
                requestAnimationFrame(renderLoop);
                visualizer.render();
            }
            renderLoop();

            // Dopasowanie rozmiaru do okna
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                visualizer.setRendererSize(window.innerWidth, window.innerHeight);
            });

            isButterchurnInit = true;
        }

        function playTrack(index) {
            audio.src = playlist[index];
            audio.load();
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.log("autoplay zablokowany przez przegladarke. kliknij gdziekolwiek na stronie, aby odtworzyc.", err);
                });
            }
        }

        audio.addEventListener('ended', () => {
            currentIndex = (currentIndex + 1) % playlist.length;
            if (currentIndex === 0) shuffle(playlist);
            playTrack(currentIndex);
        });

        function startAudio() {
            initButterchurn();

            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            playTrack(currentIndex);
            
            window.removeEventListener('click', startAudio);
            window.removeEventListener('touchstart', startAudio);
            window.removeEventListener('keydown', startAudio);
        }

        window.addEventListener('click', startAudio);
        window.addEventListener('touchstart', startAudio);
        window.addEventListener('keydown', startAudio);
    </script>

</body>
</html>
