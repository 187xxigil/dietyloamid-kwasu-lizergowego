    <style>

        @font-face {
            font-family: 'MojFont';
            src: url('MatrixType-Regular.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'MojFont', monospace, sans-serif;
        }

        #bg-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: 70% center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            opacity: 0.5;
            mix-blend-mode: screen;
            filter: grayscale(100%);
        }

        .marquee-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            overflow: hidden;
            white-space: nowrap;
            pointer-events: none;
            padding: 12px 0;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            font-size: 12px;
            color: #e0e0e0;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 3px rgba(255, 255, 255, 0.4);
            animation: marquee 30s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        #player-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 16px 22px;
            border-radius: 6px;
            backdrop-filter: blur(6px);
            user-select: none;
        }

        #disc-icon {
            width: 45px;
            height: 45px;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
            animation: spin 2s linear infinite;
            animation-play-state: paused;
            user-select: none;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #disc-icon:hover {
            transform: scale(1.08);
        }

        #disc-icon.spinning {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            padding: 4px 6px;
            transition: color 0.2s, transform 0.2s, text-shadow 0.2s;
        }

        .nav-btn:hover {
            color: #ffffff;
            transform: scale(1.15);
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        #track-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            max-width: 320px;
        }

        #track-title {
            font-size: 14px;
            color: #ffffff;
            letter-spacing: 1.5px;
            white-space: normal;
            word-break: break-word;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
            width: 100%;
        }

        #track-status {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            width: 20px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            transform: rotate(-90deg);
            cursor: pointer;
            border-radius: 2px;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 18px;
            background: #ffffff;
            border: 1px solid #000;
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        }

        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 18px;
            background: #ffffff;
            border: 1px solid #000;
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);

        #socials-toggle {

            top: 30px;
            left: 30px;

            height: 42px;

            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);

            user-select: none;
        }

        #socials-toggle:hover {

        #socials-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);

        #socials-overlay.active {

        #socials-sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;

            background: rgba(0, 0, 0, 0.85);

        .sidebar-header {

        .sidebar-content {

        .sidebar-footer {
            margin-top: auto;
            padding-top: 20px;

    </style>

    <script>

        const closeSidebar = document.getElementById('close-sidebar');

            { file: '15.m4a', title: 'SADWRIST -  ' },
            { file: '16.m4a', title: 'SADWRIST - ∻ 8NF8N8T8 ∻ ' },
            { file: '17.m4a', title: 'SADWRIST - sarbōtkarsa (সর্বোত্কর্ষ)' },
            { file: '18.m4a', title: 'SADWRIST - ♠ ♣ ♥ ♦ ♤ ♧ ♡ ♢ ♡ ♧ ♤ ♦ ♥ ♣ ♠' },
            { file: '19.m4a', title: 'SADWRIST -  ' },
            { file: '20.m4a', title: 'SADWRIST -  ' },
            { file: '21.mp3', title: 'srpski - ｢ acͥʥ ‽ яિvɘr ｣' },

            { file: '25.mp3', title: 'srpski - dontcomeback' },
            { file: '26.mp3', title: 'srpski - ☯☻…༝′°°︺»»»»' },

        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        shuffle(playlist);

        let currentIndex = 0;
        const audio = document.getElementById('bg-audio');
        const canvas = document.getElementById('canvas');
        const trackTitleEl = document.getElementById('track-title');
        const trackStatusEl = document.getElementById('track-status');
        const volumeSlider = document.getElementById('volume-slider');
        const discIcon = document.getElementById('disc-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        let audioContext = null;
        let visualizer = null;
        let isButterchurnInit = false;
        let hasStarted = false;

        let fadeInterval = null;
        let targetVolume = 1;
        let isFading = false;

        function initButterchurn() {
            if (isButterchurnInit) return;

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaElementSource(audio);

            visualizer = butterchurn.default.createVisualizer(audioContext, canvas, {
                width: window.innerWidth,
                height: window.innerHeight,
                pixelRatio: window.devicePixelRatio || 1
            });

            visualizer.connectAudio(source);
            source.connect(audioContext.destination);

            const presets = butterchurnPresets.getPresets();
            const presetKeys = Object.keys(presets);
            const randomPreset = presets[presetKeys[Math.floor(Math.random() * presetKeys.length)]];
            
            visualizer.loadPreset(randomPreset, 0.0);

            setInterval(() => {
                const nextPreset = presets[presetKeys[Math.floor(Math.random() * presetKeys.length)]];
                visualizer.loadPreset(nextPreset, 2.7);
            }, 30000);

            function renderLoop() {
                requestAnimationFrame(renderLoop);
                visualizer.render();
            }
            renderLoop();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                visualizer.setRendererSize(window.innerWidth, window.innerHeight);
            });

            isButterchurnInit = true;
        }

        function fadeIn(duration = 500) {
            clearInterval(fadeInterval);
            isFading = true;
            audio.volume = 0;
            const step = targetVolume / (duration / 20);

            fadeInterval = setInterval(() => {
                if (audio.volume + step < targetVolume) {
                    audio.volume += step;
                } else {
                    audio.volume = targetVolume;
                    clearInterval(fadeInterval);
                    isFading = false;
                }
            }, 20);
        }

        function fadeOut(duration = 500, onComplete) {
            clearInterval(fadeInterval);
            isFading = true;
            const step = audio.volume / (duration / 20);

            fadeInterval = setInterval(() => {
                if (audio.volume - step > 0.01) {
                    audio.volume -= step;
                } else {
                    audio.volume = 0;
                    clearInterval(fadeInterval);
                    isFading = false;
                    if (onComplete) onComplete();
                }
            }, 20);
        }

        function playTrack(index) {
            const currentItem = playlist[index];
            audio.src = currentItem.file;
            audio.load();
            
            trackTitleEl.textContent = currentItem.title || currentItem.file;

            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    fadeIn(500);
                }).catch(err => {
                    console.log("autoplay zablokowany przez przegladarke.", err);
                });
            }
        }

        function nextTrack() {
            if (!hasStarted) {
                startAudio();
                return;
            }
            fadeOut(300, () => {
                currentIndex = (currentIndex + 1) % playlist.length;
                playTrack(currentIndex);
            });
        }

        function prevTrack() {
            if (!hasStarted) {
                startAudio();
                return;
            }
            fadeOut(300, () => {
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
                playTrack(currentIndex);
            });
        }

        audio.addEventListener('play', () => {
            discIcon.classList.add('spinning');
        });

        audio.addEventListener('pause', () => {
            discIcon.classList.remove('spinning');
        });

        audio.addEventListener('ended', () => {
            discIcon.classList.remove('spinning');
            nextTrack();
        });

        function startAudio() {
            if (hasStarted) return;
            hasStarted = true;

            initButterchurn();

            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            playTrack(currentIndex);
            
            window.removeEventListener('click', startAudio);
            window.removeEventListener('touchstart', startAudio);
        }

        window.addEventListener('click', startAudio);
        window.addEventListener('touchstart', startAudio);

        discIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!hasStarted) {
                startAudio();
                return;
            }

            if (isFading) return;

            if (audio.paused) {
                audio.play();
                fadeIn(500);
            } else {
                fadeOut(500, () => {
                    audio.pause();
                });
            }
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            prevTrack();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            nextTrack();
        });

        volumeSlider.addEventListener('input', (e) => {
            targetVolume = parseFloat(e.target.value);
            if (!isFading) {
                audio.volume = targetVolume;
            }
            trackStatusEl.textContent = `VOLUME: ${Math.round(targetVolume * 100)}%`;
        });
    </script>
